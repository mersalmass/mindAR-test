<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>
    
    <script>
      AFRAME.registerComponent('animation-cycler', {
        init: function () {
          this.animationNames = [];
          this.currentIndex = 0;

          // Wait for model to load to see its internal animations
          this.el.addEventListener('model-loaded', () => {
            const obj = this.el.getObject3D('mesh');
            if (obj && obj.animations && obj.animations.length > 0) {
              this.animationNames = obj.animations.map(anim => anim.name);
              console.log("Found animations:", this.animationNames);
              this.updateAnim();
            }
          });

          // Use mousedown for faster response in AR
          this.el.addEventListener("mousedown", () => {
            if (this.animationNames.length > 0) {
              this.currentIndex = (this.currentIndex + 1) % this.animationNames.length;
              this.updateAnim();
            }
          });
        },

        updateAnim: function () {
          const name = this.animationNames[this.currentIndex];
          this.el.setAttribute('animation-mixer', {
            clip: name,
            loop: 'repeat',
            crossFadeDuration: 0.4
          });
          document.getElementById('debug').innerHTML = 'Playing: ' + name;
        }
      });
    </script>
  </head>

  <body>
    <div id="debug" style="position: absolute; top: 10px; left: 10px; color: white; font-size: 18px; z-index: 1000; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 5px; pointer-events: none;">
      Point camera at target...
    </div>

    <a-scene 
      mindar-image="imageTargetSrc: ./assets/Card.mind;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <a-asset-item id="avatarModel" src="./assets/Desk/scene.gltf" crossorigin="anonymous"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="near: 0.1; far: 10000; objects: .clickable"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model 
          rotation="0 180 0" 
          position="0 -0.6 0" 
          scale="0.5 0.5 0.5" 
          src="#avatarModel" 
          class="clickable"
          animation-cycler>
        </a-gltf-model>
      </a-entity>
    </a-scene>
  </body>
</html>
