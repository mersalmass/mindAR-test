
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: ./assets/Card.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" filterMinCF="0.1" filterBeta="10">
      <a-assets>
	   <img id="card" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.png" />
	   <a-asset-item id="avatarModel" src="./assets/Printer/Printer.gltf"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <!-- <a-plane src="#card" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-plane> -->
        <a-gltf-model rotation="0 180 0" position="0 -0.6 0" scale="0.5 0.5 0.5" src="#avatarModel" toggle-animation
          animation="property: position; to: 0 -0.4 0; dur: 1500; easing: easeInOutQuad; loop: true; dir: alternate"
        >
      </a-entity>
    </a-scene>
    <script>
      AFRAME.registerComponent('toggle-animation', {
        init: function() {
          this.el.addEventListener('click', () => {
            const animComp = this.el.components.animation;
            if (animComp) {
              const anim = animComp.animation;
              if (anim.paused) {
                anim.play();
              } else {
                anim.pause();
              }
            }
          });
        }
      });
    </script>
  </body>
</html>
